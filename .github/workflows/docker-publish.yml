name: Publish Docker images

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: dockerhub-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      prefix: ${{ steps.release.outputs.prefix }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || vars.DOCKERHUB_USERNAME }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          [[ "$NAMESPACE" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || { echo 'Configure DOCKERHUB_USERNAME (and optionally DOCKERHUB_NAMESPACE).'; exit 1; }
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable version such as v0.1.0.'; exit 1; }
          printf 'prefix=docker.io/%s/quant4dad-opensource\nversion=%s\n' "$NAMESPACE" "$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      IMAGE_PREFIX: ${{ needs.prepare.outputs.prefix }}
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Check installer
        run: |
          bash -n scripts/install.sh scripts/download.sh scripts/package-docker-release.sh
          python3 scripts/test-install.py
          docker compose -f deploy/compose.yaml --profile mcp --profile agent config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build API
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: quant4dad-opensource-api:local
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}
      - name: Build Web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          load: true
          tags: quant4dad-opensource-web:local
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
      - name: Build MCP
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mcp
          load: true
          tags: quant4dad-opensource-mcp:local
          cache-from: type=gha,scope=mcp-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=mcp-${{ matrix.arch }}
      - name: Build Agent Runtime
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.agent
          load: true
          tags: quant4dad-opensource-agent:local
          cache-from: type=gha,scope=agent-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=agent-${{ matrix.arch }}
      - name: Verify all four services before publishing
        run: |
          ./scripts/install.sh --no-build --with-mcp --with-agent
          python3 scripts/standalone-smoke.py --web-url http://127.0.0.1:3000 \
            --token-file data/standalone/config/login-token \
            --mcp-url http://127.0.0.1:8090/mcp \
            --mcp-token-file data/standalone/config/mcp-token --expect-agent
      - name: Publish verified architecture images
        run: |
          for service in api web mcp agent; do
            image="$IMAGE_PREFIX-$service:$VERSION-$ARCH"
            docker tag "quant4dad-opensource-$service:local" "$image"
            docker push "$image"
          done
      - name: Stop verification installation
        if: always()
        run: |
          if [[ -f data/standalone/deployment.env ]]; then
            docker compose --env-file data/standalone/deployment.env -f deploy/compose.yaml down
          fi

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      IMAGE_PREFIX: ${{ needs.prepare.outputs.prefix }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform release tags
        run: |
          for service in api web mcp agent; do
            image="$IMAGE_PREFIX-$service"
            docker buildx imagetools create --tag "$image:$VERSION" --tag "$image:latest" \
              "$image:$VERSION-amd64" "$image:$VERSION-arm64"
          done
      - name: Package installer and pinned image references
        run: |
          bash scripts/package-docker-release.sh "$IMAGE_PREFIX" "$VERSION" quant4dad-docker.tar.gz
          sha256sum quant4dad-docker.tar.gz > quant4dad-docker.tar.gz.sha256
          printf 'Docker images for linux/amd64 and linux/arm64.\n\n' > release-notes.md
          for service in api web mcp agent; do
            printf -- '- `%s-%s:%s`\n' "$IMAGE_PREFIX" "$service" "$VERSION" >> release-notes.md
          done
          printf '\nExtract quant4dad-docker.tar.gz and run ./scripts/install.sh --pull.\n' >> release-notes.md
      - name: Publish download bundle
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" quant4dad-docker.tar.gz quant4dad-docker.tar.gz.sha256 --clobber
          else
            gh release create "$VERSION" quant4dad-docker.tar.gz quant4dad-docker.tar.gz.sha256 \
              --target "$GITHUB_SHA" --title "$VERSION" --notes-file release-notes.md
          fi
